<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Games - Casino Slot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 100%; max-width: 480px; padding: 20px; text-align: center; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .balance-box { font-size: 18px; font-weight: bold; color: #facc15; }
        .slot-machine { background: #1e293b; border: 4px solid #eab308; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(234, 179, 8, 0.2); margin-bottom: 20px; }
        .screen { display: flex; justify-content: center; gap: 10px; background: #090d16; padding: 15px; border-radius: 8px; border: 2px inset #334155; margin-bottom: 20px; font-size: 40px; }
        .reel { background: #111827; width: 70px; height: 90px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #374151; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        .bet-box { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 10px 15px; border-radius: 8px; }
        .bet-box input { background: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px; width: 100px; text-align: center; border-radius: 6px; font-size: 16px; }
        .spin-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); transition: 0.2s; }
        .spin-btn:active { transform: scale(0.96); }
        .back-btn { background: #334155; color: #cbd5e1; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>👑 Kral Slot</h2>
            <div class="balance-box">Balans: <span id="balance">1000</span> ₼</div>
        </div>

        <div class="slot-machine">
            <div class="screen">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">🍋</div>
                <div class="reel" id="reel3">🔔</div>
            </div>

            <div class="controls">
                <div class="bet-box">
                    <label>Mərc məbləği:</label>
                    <input type="number" id="betAmount" value="10" min="1">
                </div>
                <button class="spin-btn" onclick="spinWheel()">Fırlat (SPIN)</button>
            </div>
        </div>

        <button class="back-btn" onclick="window.location.href='../index.html'">Lobyə qayıt</button>
    </div>

    <script>
        // Simvollar siyahısı
        const symbols = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
        let balance = 1000; // Firebase-dən gələn balansla əvəz olunacaq

        function spinWheel() {
            const bet = parseInt(document.getElementById('betAmount').value);
            
            if (isNaN(bet) || bet <= 0) {
                alert("Düzgün mərc daxil edin!");
                return;
            }

            if (balance < bet) {
                alert("Balansınız kifayət etmir!");
                return;
            }

            // Mərc çıxılır
            balance -= bet;
            updateBalance();

            // Vizual fırlanma effekti
            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');

            r1.innerHTML = '🔄';
            r2.innerHTML = '🔄';
            r3.innerHTML = '🔄';

            setTimeout(() => {
                // Təsadüfi nəticə
                const res1 = symbols[Math.floor(Math.random() * symbols.length)];
                const res2 = symbols[Math.floor(Math.random() * symbols.length)];
                const res3 = symbols[Math.floor(Math.random() * symbols.length)];

                r1.innerHTML = res1;
                r2.innerHTML = res2;
                r3.innerHTML = res3;

                // Qazanc yoxlanışı (Üçü də eyni olsa mərcin 5 qatı)
                if (res1 === res2 && res2 === res3) {
                    const win = bet * 5;
                    balance += win;
                    alert(`Təbriklər, qazandın! +${win} ₼`);
                }

                updateBalance();
                // BURADA FIREBASE-E YENİ BALANSI YAZA BİLƏRSƏN
            }, 600);
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }
    </script>
</body>
</html>

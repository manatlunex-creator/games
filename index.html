<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Games - Royal Casino Slot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: radial-gradient(circle, #1a1c29 0%, #0b0c10 100%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .casino-wrapper { width: 100%; max-width: 440px; background: #12141d; border: 3px solid #d4af37; border-radius: 20px; padding: 20px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1b1e2b; padding: 12px 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2a2e43; }
        .logo { font-size: 18px; font-weight: 900; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; }
        .balance-display { font-size: 16px; font-weight: bold; color: #00ffcc; background: #0b0c10; padding: 6px 12px; border-radius: 8px; border: 1px solid #1f2430; }
        .slot-frame { background: #07080c; border: 4px solid #2a2e43; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
        .reels-container { display: flex; justify-content: space-between; gap: 8px; background: #0f111a; padding: 12px; border-radius: 10px; border: 2px solid #d4af37; }
        .reel { background: linear-gradient(to bottom, #1f2430, #12141d); width: 30%; height: 110px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 50px; border: 1px solid #3a3f58; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .win-banner { height: 35px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; color: #ffd700; margin-bottom: 15px; text-transform: uppercase; }
        .control-panel { display: flex; flex-direction: column; gap: 12px; background: #1b1e2b; padding: 15px; border-radius: 12px; border: 1px solid #2a2e43; }
        .bet-row { display: flex; justify-content: space-between; align-items: center; }
        .bet-row label { font-size: 14px; color: #a0aec0; font-weight: 600; }
        .bet-controls { display: flex; gap: 5px; align-items: center; }
        .bet-btn { background: #2a2e43; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .bet-input { background: #0b0c10; border: 1px solid #3a3f58; color: #fff; width: 60px; height: 32px; text-align: center; border-radius: 6px; font-size: 15px; font-weight: bold; }
        .spin-action-btn { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border: none; padding: 16px; font-size: 22px; font-weight: 900; border-radius: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 20px rgba(255, 75, 43, 0.5); transition: 0.1s; }
        .spin-action-btn:active { transform: scale(0.97); }
        .spin-action-btn:disabled { background: #4a5568; cursor: not-allowed; box-shadow: none; }
        .back-lobby { background: transparent; color: #a0aec0; border: 1px solid #2a2e43; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; transition: 0.2s; }
        .back-lobby:hover { background: #1b1e2b; color: #fff; }
    </style>
</head>
<body>

    <div class="casino-wrapper">
        <div class="top-bar">
            <div class="logo">👑 Kral Slot</div>
            <div class="balance-display"><span id="balance">1000</span> ₼</div>
        </div>

        <div class="slot-frame">
            <div class="reels-container">
                <div class="reel" id="reel1">💎</div>
                <div class="reel" id="reel2">7️⃣</div>
                <div class="reel" id="reel3">🍒</div>
            </div>
        </div>

        <div class="win-banner" id="winBanner">ÖZGÜVƏNLƏ FIRLAT!</div>

        <div class="control-panel">
            <div class="bet-row">
                <label>Mərc:</label>
                <div class="bet-controls">
                    <button class="bet-btn" onclick="changeBet(-10)">-</button>
                    <input type="number" id="betAmount" class="bet-input" value="10" readonly>
                    <button class="bet-btn" onclick="changeBet(10)">+</button>
                </div>
            </div>
            <button class="spin-action-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
        </div>

        <button class="back-lobby" onclick="window.location.href='../index.html'">← Lobyə Qayıt</button>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
        const payouts = { '🍒': 3, '🍋': 4, '🔔': 5, '⭐': 8, '💎': 12, '7️⃣': 20 };
        let balance = 1000;

        function changeBet(amount) {
            let betInput = document.getElementById('betAmount');
            let currentBet = parseInt(betInput.value) + amount;
            if (currentBet >= 10 && currentBet <= 500) {
                betInput.value = currentBet;
            }
        }

        function startSpin() {
            let bet = parseInt(document.getElementById('betAmount').value);
            let banner = document.getElementById('winBanner');
            let spinBtn = document.getElementById('spinBtn');

            if (balance < bet) {
                banner.style.color = '#ff416c';
                banner.innerText = 'BALANS KİFAYƏT ETMİR!';
                return;
            }

            balance -= bet;
            updateBalance();
            spinBtn.disabled = true;
            banner.style.color = '#ffd700';
            banner.innerText = 'FIRLANIR...';

            let r1 = document.getElementById('reel1');
            let r2 = document.getElementById('reel2');
            let r3 = document.getElementById('reel3');

            // Fırlanma animasiya effekti (tez-tez dəyişmə)
            let counter = 0;
            let interval = setInterval(() => {
                r1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                counter++;

                if (counter > 12) {
                    clearInterval(interval);
                    
                    // Son nəticə
                    let res1 = symbols[Math.floor(Math.random() * symbols.length)];
                    let res2 = symbols[Math.floor(Math.random() * symbols.length)];
                    // Həyəcan üçün şans tənzimləməsi (1win/pinup style)
                    let res3 = (Math.random() < 0.35) ? res1 : symbols[Math.floor(Math.random() * symbols.length)];
                    if(res1 !== res2) res3 = symbols[Math.floor(Math.random() * symbols.length)]; // tez-tez eyni düşməsin deyə

                    r1.innerText = res1;
                    r2.innerText = res2;
                    r3.innerText = res3;

                    if (res1 === res2 && res2 === res3) {
                        let winAmount = bet * payouts[res1];
                        balance += winAmount;
                        banner.style.color = '#00ffcc';
                        banner.innerText = `BÖYÜK QAZANC! +${winAmount} ₼`;
                    } else if (res1 === res2 || res2 === res3 || res1 === res3) {
                        let winAmount = Math.floor(bet * 1.5);
                        balance += winAmount;
                        banner.style.color = '#00ffcc';
                        banner.innerText = `QAZANDIN: +${winAmount} ₼`;
                    } else {
                        banner.style.color = '#ff416c';
                        banner.innerText = 'Uduzdun, bir daha sına!';
                    }

                    updateBalance();
                    spinBtn.disabled = false;
                }
            }, 80);
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }
    </script>
</body>
</html>

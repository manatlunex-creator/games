<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Games - Casino</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; user-select: none; margin: 0; padding: 0; }
        body { background: #12151e; color: #fff; padding-bottom: 30px; }

        /* HEADER & DEPOZİT */
        .top-bar { background: #1a1e29; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; sticky; top: 0; z-index: 100; }
        .balance-box { background: #0f121a; border: 1px solid #2a3142; padding: 6px 12px; border-radius: 8px; font-weight: bold; color: #4ade80; font-size: 18px; }
        .header-btns { display: flex; gap: 8px; }
        .btn-deposit { background: #e50914; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-withdraw { background: #22c55e; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }

        /* KATEGORİYA LENTİ */
        .cat-bar { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #161a24; }
        .cat-item { background: #222836; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; color: #94a3b8; border: 1px solid #2d3548; }
        .cat-item.active { background: #e50914; color: #fff; border-color: #e50914; }

        /* OYUNLAR ŞƏBƏKƏSİ (2 SÜTUNLU KAZİNO KARTLARI) */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .game-card { background: #1c2230; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #2a3142; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .game-thumb { width: 100%; height: 130px; object-fit: cover; display: block; }
        .game-title { padding: 8px; font-size: 14px; font-weight: bold; text-align: center; color: #ffd700; background: #161a24; }

        /* OVERLAY OYNA DÜYMƏSİ */
        .card-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; }
        .game-card:hover .card-overlay, .game-card:active .card-overlay { opacity: 1; }
        .play-btn { background: #e50914; color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 0 10px #e50914; }

        /* PƏNCƏRƏ (MODAL) OYUN ZONASI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 15px; }
        .modal-content { background: #161a24; border-radius: 16px; max-width: 450px; margin: 20px auto; padding: 20px; border: 1px solid #ffd700; position: relative; text-align: center; }
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; color: #fff; cursor: pointer; font-weight: bold; }

        /* MƏRC & OYUN ELEMENLTƏRİ */
        .bet-buttons { display: flex; justify-content: center; gap: 6px; margin: 12px 0; }
        .bet-btn { background: #222836; color: #ffd700; border: 1px solid #ffd700; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .bet-btn.active { background: #ffd700; color: #000; }
        .fruit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 260px; margin: 15px auto; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 280px; margin: 15px auto; }
        .cell { background: #222836; border-radius: 8px; height: 55px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #334155; cursor: pointer; }
        .action-btn { background: #e50914; color: #fff; border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="balance-box"><span id="userBalance">10.00</span> ₼</div>
        <div class="header-btns">
            <!-- Balans Artır Linki -->
            <a href="https://m10.az" target="_blank" class="btn-deposit">Hesabı artırmaq</a>
            <!-- Çıxarış Linki -->
            <a href="https://t.me/admin" target="_blank" class="btn-withdraw">Çıxarış</a>
        </div>
    </div>

    <!-- KATEGORİYALAR -->
    <div class="cat-bar">
        <div class="cat-item active">🔥 Bütün oyunlar</div>
        <div class="cat-item">🎰 Slots</div>
        <div class="cat-item">💣 Mines</div>
        <div class="cat-item">👑 VIP Games</div>
    </div>

    <!-- OYUN KARTLARI (KAZİNO STİLİ) -->
    <div class="games-grid">
        
        <!-- 1. FRUITS GAME KARTI -->
        <div class="game-card">
            <!-- HAZIR İNTERNET ŞƏKLİ -->
            <img src="https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=500" class="game-thumb">
            <div class="game-title">Fruits Game 3x3</div>
            <div class="card-overlay">
                <button class="play-btn" onclick="openGame('fruitModal')">OYNA</button>
            </div>
        </div>

        <!-- 2. MINES GAME KARTI -->
        <div class="game-card">
            <!-- HAZIR İNTERNET ŞƏKLİ -->
            <img src="https://images.unsplash.com/photo-1605870445919-838d190e8e1b?w=500" class="game-thumb">
            <div class="game-title">Mines Game 5x5</div>
            <div class="card-overlay">
                <button class="play-btn" onclick="openGame('minesModal')">OYNA</button>
            </div>
        </div>

    </div>

    <!-- FRUITS GAME MODAL (PƏNCƏRƏSİ) -->
    <div id="fruitModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame('fruitModal')">&times;</span>
            <h2 style="color: #ffd700; margin-bottom: 10px;">🎰 Fruits Game</h2>
            
            <div class="bet-buttons">
                <button class="bet-btn active" onclick="setBet(0.20, this)">0.20 ₼</button>
                <button class="bet-btn" onclick="setBet(0.50, this)">0.50 ₼</button>
                <button class="bet-btn" onclick="setBet(1.00, this)">1.00 ₼</button>
                <button class="bet-btn" onclick="setBet(5.00, this)">5.00 ₼</button>
            </div>

            <div class="fruit-grid" id="fruitGrid">
                <div class="cell">❓</div><div class="cell">❓</div><div class="cell">❓</div>
                <div class="cell">❓</div><div class="cell">❓</div><div class="cell">❓</div>
                <div class="cell">❓</div><div class="cell">❓</div><div class="cell">❓</div>
            </div>

            <button class="action-btn" onclick="spinFruits()">FIRLAT 🎰</button>
        </div>
    </div>

    <!-- MINES GAME MODAL (PƏNCƏRƏSİ) -->
    <div id="minesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame('minesModal')">&times;</span>
            <h2 style="color: #ffd700; margin-bottom: 10px;">💣 Mines Game</h2>

            <div class="bet-buttons">
                <button class="bet-btn active" onclick="setBet(0.20, this)">0.20 ₼</button>
                <button class="bet-btn" onclick="setBet(0.50, this)">0.50 ₼</button>
                <button class="bet-btn" onclick="setBet(1.00, this)">1.00 ₼</button>
                <button class="bet-btn" onclick="setBet(5.00, this)">5.00 ₼</button>
            </div>

            <div class="mines-grid" id="minesGrid"></div>

            <button class="action-btn" onclick="initMines()">YENİ OYUN 💣</button>
        </div>
    </div>

    <script>
        let currentBet = 0.20;
        let balance = parseFloat(localStorage.getItem('userBalance')) || 10.00;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // Modal Aç/Bağla
        function openGame(id) {
            document.getElementById(id).style.display = 'block';
            if(id === 'minesModal') initMines();
        }
        function closeGame(id) {
            document.getElementById(id).style.display = 'none';
        }

        function setBet(amt, btn) {
            currentBet = amt;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function spinFruits() {
            if (balance < currentBet) return alert("Balans kifayət etmir!");
            balance -= currentBet;
            updateBalance();

            const icons = ['🍎', '🍋', '🍇', '🔔', '💎', '7️⃣'];
            const cells = document.querySelectorAll('#fruitGrid .cell');
            cells.forEach(cell => {
                cell.innerText = icons[Math.floor(Math.random() * icons.length)];
            });
        }

        function initMines() {
            if (balance < currentBet) return alert("Balans kifayət etmir!");
            balance -= currentBet;
            updateBalance();

            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = '❓';
                cell.onclick = function() {
                    if (this.innerText !== '❓') return;
                    this.innerText = Math.random() > 0.3 ? '💎' : '💣';
                };
                grid.appendChild(cell);
            }
        }

        function updateBalance() {
            document.getElementById('userBalance').innerText = balance.toFixed(2);
            localStorage.setItem('userBalance', balance.toFixed(2));
        }
    </script>
</body>
</html>

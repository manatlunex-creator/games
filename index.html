<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram SDK & Firebase Compat SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #0a0505;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .container { width: 100%; max-width: 440px; text-align: center; }

    /* Header & Balance */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #220505 0%, #110202 100%);
      border: 1px solid #ff2a2a;
      border-radius: 12px;
      padding: 10px 15px;
      margin-bottom: 10px;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.3);
    }
    .jackpot-box { font-size: 14px; color: #ffcc00; font-weight: bold; text-shadow: 0 0 8px #ffaa00; }
    .balance-box { font-size: 16px; font-weight: bold; color: #2ecc71; }
    
    .action-btns { display: flex; gap: 8px; margin-bottom: 12px; }
    .action-btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold;
      cursor: pointer; color: #fff; text-decoration: none; font-size: 13px;
    }
    .btn-deposit { background: linear-gradient(45deg, #11998e, #38ef7d); }
    .btn-withdraw { background: linear-gradient(45deg, #eb3349, #f45c43); }

    /* PIN Screen */
    #pin-screen {
      background: #140505;
      border: 2px solid #ff2a2a;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
    }
    input[type="text"], input[type="number"] {
      width: 85%; padding: 12px; border-radius: 8px; border: 1px solid #ff4444;
      background: #000; color: #fff; font-size: 18px; text-align: center; margin-bottom: 12px; outline: none;
    }
    .btn-gold {
      width: 85%; padding: 12px; border-radius: 8px; border: none;
      background: linear-gradient(180deg, #ffe600 0%, #ff9900 100%);
      color: #000; font-weight: bold; font-size: 16px; cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
    }
    #status { margin-top: 10px; font-size: 14px; font-weight: bold; }

    /* Tabs */
    #game-screen { display: none; width: 100%; }
    .tabs { display: flex; gap: 5px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 10px 5px; background: #1a0808; border: 1px solid #441111;
      color: #aaa; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
    }
    .tab-btn.active { background: #ff1e1e; color: #fff; border-color: #ff5555; box-shadow: 0 0 10px #ff0000; }

    .game-panel {
      background: linear-gradient(180deg, #180000 0%, #080000 100%);
      border: 2px solid #ff2424; border-radius: 15px; padding: 12px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); display: none;
    }
    .game-panel.active { display: block; }

    /* VIP Slot 5-Reel (1win UI) */
    .paytable {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
      background: #000; padding: 6px; border-radius: 8px; border: 1px solid #ff4444; margin-bottom: 10px; font-size: 10px;
    }
    .pay-item { background: #1a0505; border: 1px solid #551111; padding: 4px; border-radius: 4px; color: #ffcc00; }
    
    .slot-frame {
      display: flex; justify-content: space-around; background: #000;
      border: 3px solid #ffcc00; border-radius: 10px; padding: 6px; gap: 4px; margin-bottom: 12px;
      box-shadow: inset 0 0 15px rgba(255, 204, 0, 0.4);
    }
    .reel-col {
      flex: 1; display: flex; flex-direction: column; gap: 4px; background: #111;
      border: 1px solid #333; border-radius: 6px; padding: 4px;
    }
    .slot-icon { font-size: 30px; height: 42px; line-height: 42px; background: #1a0505; border-radius: 4px; }

    /* Mines Game UI */
    .mines-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0;
    }
    .mine-card {
      aspect-ratio: 1; background: #2a0a0a; border: 1px solid #ff3333; border-radius: 8px;
      font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .mine-card.open { background: #05200a; border-color: #2ecc71; }
    .mine-card.boom { background: #4a0000; border-color: #ff0000; }

    /* Wheel UI */
    .wheel-wrapper { position: relative; width: 200px; height: 200px; margin: 10px auto; }
    #wheel {
      width: 100%; height: 100%; border-radius: 50%; border: 4px solid #ffcc00;
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      background: conic-gradient(#ff0000 0deg 60deg, #0088ff 60deg 120deg, #00cc44 120deg 180deg, #aa00cc 180deg 240deg, #ffcc00 240deg 300deg, #ff6600 300deg 360deg);
    }
    .wheel-pointer {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid #fff; z-index: 5;
    }

    .bet-presets { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
    .preset-btn { padding: 6px 12px; background: #330808; border: 1px solid #ff4444; color: #fff; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="color: #ff2a2a; text-shadow: 0 0 10px #ff0000; margin-bottom: 10px;">👑 KRAL GAMES VIP 👑</h1>

    <!-- PIN Screen -->
    <div id="pin-screen">
      <h3 style="margin-bottom: 15px; color: #ffcc00;">Giriş Üçün PIN Kodu Daxil Edin</h3>
      <input type="text" id="pinInput" placeholder="PIN KODU">
      <br>
      <button class="btn-gold" onclick="verifyPin()">GİRİŞ ET</button>
      <div id="status"></div>
    </div>

    <!-- Main Game Area -->
    <div id="game-screen">
      
      <!-- Top Bar -->
      <div class="header-bar">
        <div class="jackpot-box">💎 JACKPOT: <span id="jackpot-val">245.80</span> AZN</div>
        <div class="balance-box">💰 <span id="user-balance">100.00</span> AZN</div>
      </div>

      <!-- Deposit / Withdraw Buttons -->
      <div class="action-btns">
        <a href="https://t.me/gamesadmin1" target="_blank" class="action-btn btn-deposit">➕ BALANS ARTIR</a>
        <a href="https://t.me/gamesadmin1" target="_blank" class="action-btn btn-withdraw">💸 ÇIXARIŞ ET</a>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('fruit', this)">🍉 VIP Slot</button>
        <button class="tab-btn" onclick="switchTab('mines', this)">💣 Mines</button>
        <button class="tab-btn" onclick="switchTab('wheel', this)">🎡 Çarx</button>
      </div>

      <!-- 1. VIP FRUIT SLOT (1WIN STYLE) -->
      <div id="fruit-panel" class="game-panel active">
        <div class="paytable">
          <div class="pay-item">🍉 5x: 100 | 3x: 7</div>
          <div class="pay-item">7️⃣ 5x: 500 | 3x: 10</div>
          <div class="pay-item">🍇 5x: 20 | 3x: 5</div>
        </div>

        <div class="slot-frame">
          <div class="reel-col" id="col1"><div class="slot-icon">🍉</div><div class="slot-icon">🍒</div><div class="slot-icon">7️⃣</div></div>
          <div class="reel-col" id="col2"><div class="slot-icon">7️⃣</div><div class="slot-icon">🍇</div><div class="slot-icon">🍋</div></div>
          <div class="reel-col" id="col3"><div class="slot-icon">🍇</div><div class="slot-icon">🍉</div><div class="slot-icon">🍒</div></div>
          <div class="reel-col" id="col4"><div class="slot-icon">🍊</div><div class="slot-icon">7️⃣</div><div class="slot-icon">🍉</div></div>
          <div class="reel-col" id="col5"><div class="slot-icon">🍒</div><div class="slot-icon">🍋</div><div class="slot-icon">🍇</div></div>
        </div>

        <div class="bet-presets">
          <button class="preset-btn" onclick="setBet('slotBet', 1)">1</button>
          <button class="preset-btn" onclick="setBet('slotBet', 5)">5</button>
          <button class="preset-btn" onclick="setBet('slotBet', 10)">10</button>
          <button class="preset-btn" onclick="setBet('slotBet', 20)">20</button>
        </div>
        <input type="number" id="slotBet" value="2" min="1" placeholder="Mərc AZN">
        <br>
        <button class="btn-gold" onclick="spinSlot()">START (SPIN)</button>
      </div>

      <!-- 2. MINES GAME -->
      <div id="mines-panel" class="game-panel">
        <div style="font-size: 13px; color: #ffcc00; margin-bottom: 6px;">Vuruq: <span id="mine-mult">1.00</span>x</div>
        <div class="mines-grid" id="minesGrid"></div>
        <input type="number" id="minesBet" value="5" min="1" placeholder="Mərc AZN">
        <br>
        <button class="btn-gold" id="minesStartBtn" onclick="startMines()">OYUNA BAŞLA</button>
        <button class="btn-gold" id="minesCashoutBtn" onclick="cashoutMines()" style="display:none; background: linear-gradient(180deg, #2ecc71, #27ae60); color:#fff;">CASHOUT</button>
      </div>

      <!-- 3. WHEEL GAME -->
      <div id="wheel-panel" class="game-panel">
        <div class="wheel-wrapper">
          <div class="wheel-pointer"></div>
          <div id="wheel"></div>
        </div>
        <input type="number" id="wheelBet" value="5" min="1" placeholder="Mərc AZN">
        <br>
        <button class="btn-gold" onclick="spinWheel()">ÇARXI FIRLAT</button>
      </div>

      <div id="game-res" style="margin-top: 12px; font-weight: bold; font-size: 15px; color:#ffcc00;"></div>

    </div>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCk2Szhnp_5q--hnKesbVs9Dp5eMj8ePLI",
      authDomain: "game-44f1a.firebaseapp.com",
      databaseURL: "https://game-44f1a-default-rtdb.firebaseio.com",
      projectId: "game-44f1a",
      storageBucket: "game-44f1a.firebasestorage.app",
      messagingSenderId: "121003848252",
      appId: "1:121003848252:web:b9b2cea6c9d9682e89c939",
      measurementId: "G-CN767860D4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- PIN SYSTEM ---
    function verifyPin() {
      const pin = document.getElementById("pinInput").value.trim();
      const status = document.getElementById("status");

      if (!pin) {
        status.style.color = "orange"; status.innerText = "PIN daxil edin!"; return;
      }
      status.style.color = "#ffcc00"; status.innerText = "YOXLANIŞ...";

      db.ref("pins/" + pin).once("value")
        .then((snapshot) => {
          if (snapshot.exists()) {
            status.style.color = "#2ecc71"; status.innerText = "Giriş Uğurludur!";
            setTimeout(() => {
              document.getElementById("pin-screen").style.display = "none";
              document.getElementById("game-screen").style.display = "block";
              initMinesGrid();
            }, 600);
          } else {
            status.style.color = "#ff3333"; status.innerText = "Səhv PIN Kodu!";
          }
        })
        .catch((err) => {
          console.error(err);
          status.style.color = "#ff3333"; status.innerText = "Bazaya qoşulma xətası!";
        });
    }

    // Dynamic Jackpot
    let jackpotVal = 245.80;
    setInterval(() => {
      jackpotVal += (Math.random() * 0.15);
      if (jackpotVal > 500) jackpotVal = 50.00;
      document.getElementById("jackpot-val").innerText = jackpotVal.toFixed(2);
    }, 2000);

    // Global Balance & Tabs
    let balance = 100.00;
    function updateBal() { document.getElementById("user-balance").innerText = balance.toFixed(2); }
    function setBet(id, val) { document.getElementById(id).value = val; }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tab + '-panel').classList.add('active');
      document.getElementById('game-res').innerText = '';
    }

    // --- 1. VIP SLOT LOGIC ---
    const icons = ['🍉', '7️⃣', '🍇', '🍒', '🍊', '🍋'];
    function spinSlot() {
      const bet = parseFloat(document.getElementById("slotBet").value);
      const res = document.getElementById("game-res");

      if (isNaN(bet) || bet <= 0 || bet > balance) {
        res.style.color = "red"; res.innerText = "Kifayət qədər balans yoxdur!"; return;
      }

      balance -= bet; updateBal();
      res.innerText = "Fırlanır...";

      let counter = 0;
      const spinInt = setInterval(() => {
        for(let c = 1; c <= 5; c++) {
          const col = document.getElementById('col' + c);
          col.innerHTML = `
            <div class="slot-icon">${icons[Math.floor(Math.random()*icons.length)]}</div>
            <div class="slot-icon">${icons[Math.floor(Math.random()*icons.length)]}</div>
            <div class="slot-icon">${icons[Math.floor(Math.random()*icons.length)]}</div>
          `;
        }
        counter++;
        if(counter > 12) {
          clearInterval(spinInt);
          // Check Win Logic
          const isJackpot = Math.random() < 0.05; // 5% chance
          const winMult = isJackpot ? 50 : (Math.random() < 0.4 ? 2.5 : 0);
          
          if(winMult > 0) {
            const win = bet * winMult;
            balance += win; updateBal();
            res.style.color = "#2ecc71";
            res.innerText = isJackpot ? `🔥 BIG JACKPOT! +${win.toFixed(2)} AZN` : `🎉 UDUŞ! +${win.toFixed(2)} AZN`;
          } else {
            res.style.color = "#ff3333"; res.innerText = "Uduzduz!";
          }
        }
      }, 80);
    }

    // --- 2. MINES GAME LOGIC ---
    let mineLocations = [];
    let minesActive = false;
    let mineBet = 0;
    let openedCount = 0;

    function initMinesGrid() {
      const grid = document.getElementById("minesGrid");
      grid.innerHTML = "";
      for(let i=0; i<15; i++) {
        const card = document.createElement("div");
        card.className = "mine-card";
        card.dataset.index = i;
        card.onclick = () => clickMine(i);
        grid.appendChild(card);
      }
    }

    function startMines() {
      const bet = parseFloat(document.getElementById("minesBet").value);
      if (isNaN(bet) || bet <= 0 || bet > balance) {
        alert("Kifayət qədər balans yoxdur!"); return;
      }
      balance -= bet; mineBet = bet; updateBal();
      minesActive = true; openedCount = 0;
      document.getElementById("mine-mult").innerText = "1.00";

      // 3 mines randomly
      mineLocations = [];
      while(mineLocations.length < 3) {
        let r = Math.floor(Math.random() * 15);
        if(!mineLocations.includes(r)) mineLocations.push(r);
      }

      initMinesGrid();
      document.getElementById("minesStartBtn").style.display = "none";
      document.getElementById("minesCashoutBtn").style.display = "inline-block";
      document.getElementById("game-res").innerText = "Minaları seçin!";
    }

    function clickMine(idx) {
      if(!minesActive) return;
      const cards = document.querySelectorAll(".mine-card");
      const card = cards[idx];
      if(card.classList.contains("open")) return;

      if(mineLocations.includes(idx)) {
        // Boom
        card.classList.add("boom"); card.innerText = "💣";
        minesActive = false;
        document.getElementById("game-res").style.color = "red";
        document.getElementById("game-res").innerText = "💥 MİNAYA DÜŞDÜNÜZ!";
        document.getElementById("minesStartBtn").style.display = "inline-block";
        document.getElementById("minesCashoutBtn").style.display = "none";
      } else {
        card.classList.add("open"); card.innerText = "💎";
        openedCount++;
        const currentMult = (1 + openedCount * 0.35).toFixed(2);
        document.getElementById("mine-mult").innerText = currentMult;
      }
    }

    function cashoutMines() {
      if(!minesActive || openedCount === 0) return;
      const mult = parseFloat(document.getElementById("mine-mult").innerText);
      const win = mineBet * mult;
      balance += win; updateBal();
      minesActive = false;
      document.getElementById("game-res").style.color = "#2ecc71";
      document.getElementById("game-res").innerText = `💰 CASHOUT: +${win.toFixed(2)} AZN`;
      document.getElementById("minesStartBtn").style.display = "inline-block";
      document.getElementById("minesCashoutBtn").style.display = "none";
    }

    // --- 3. WHEEL GAME LOGIC ---
    let wheelDeg = 0;
    function spinWheel() {
      const bet = parseFloat(document.getElementById("wheelBet").value);
      const res = document.getElementById("game-res");
      if (isNaN(bet) || bet <= 0 || bet > balance) {
        res.style.color = "red"; res.innerText = "Kifayət qədər balans yoxdur!"; return;
      }
      balance -= bet; updateBal();
      res.innerText = "Çarx fırlanır...";

      wheelDeg += 1800 + Math.floor(Math.random() * 360);
      document.getElementById("wheel").style.transform = `rotate(${wheelDeg}deg)`;

      setTimeout(() => {
        const mults = [2, 0, 1.5, 0.5, 3, 0];
        const actualDeg = (360 - (wheelDeg % 360)) % 360;
        const mult = mults[Math.floor(actualDeg / 60)];
        const win = bet * mult;
        balance += win; updateBal();

        if(win > 0) {
          res.style.color = "#2ecc71"; res.innerText = `🎉 QAZANDINIZ: +${win.toFixed(2)} AZN`;
        } else {
          res.style.color = "#ff3333"; res.innerText = "Uduşsuz fırlanma!";
        }
      }, 4000);
    }
  </script>
</body>

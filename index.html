<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Games - Casino Mini App</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        body { background: #0a0a0c; color: #ffffff; margin: 0; padding: 15px; text-align: center; }
        
        /* HEADER VƏ BALANS */
        .header { background: linear-gradient(135deg, #1e1b4b, #311b92); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .balance-title { font-size: 14px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { font-size: 32px; font-weight: 900; color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); margin: 5px 0; }

        /* OYUN KARTLARI */
        .game-card { background: #13151c; border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 1px solid #2a2d3d; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .game-banner { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; border: 1px solid #ffd700; margin-bottom: 15px; }
        .game-title { font-size: 22px; font-weight: bold; color: #ffd700; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 15px; }

        /* MƏRC DÜYMƏLƏRİ */
        .bet-container { margin: 15px 0; }
        .bet-label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .bet-buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .bet-btn { background: #1e293b; color: #ffd700; border: 1px solid #ffd700; padding: 10px 14px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .bet-btn.active { background: #ffd700; color: #000; box-shadow: 0 0 12px #ffd700; transform: scale(1.05); }

        /* 3x3 MEYVƏ ŞƏBƏKƏSİ */
        .fruit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 15px auto; background: #090a0f; padding: 12px; border-radius: 14px; border: 1px solid #334155; }
        .fruit-cell { background: #1e293b; border-radius: 10px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 1px solid #475569; transition: transform 0.1s; }
        .fruit-cell.spin { transform: rotateX(360deg); }

        /* 5x5 MINES ŞƏBƏKƏSİ */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 320px; margin: 15px auto; background: #090a0f; padding: 12px; border-radius: 14px; border: 1px solid #334155; }
        .mine-cell { background: #1e293b; border-radius: 8px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1px solid #475569; cursor: pointer; }
        .mine-cell.open-gem { background: #064e3b; border-color: #10b981; }
        .mine-cell.open-bomb { background: #7f1d1d; border-color: #ef4444; }

        /* ƏSAS FƏALİYYƏT DÜYMƏSİ */
        .main-btn { background: linear-gradient(135deg, #eab308, #ca8a04); color: #000; border: none; width: 100%; max-width: 300px; padding: 14px; font-size: 18px; font-weight: 900; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4); text-transform: uppercase; }
        .main-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- XƏBƏRDARLIQ MƏTNi VƏ BALANS -->
    <div class="header">
        <div class="balance-title">👑 ƏSAS BALANS QALIĞI</div>
        <div class="balance-amount"><span id="userBalance">10.00</span> ₼</div>
    </div>

    <!-- 1. MEYVƏ OYUNU -->
    <div class="game-card">
        <!-- 🔴 ƏVƏZ ET: MEYVƏ ŞƏKLİNİN LİNKİNİ AŞAĞIDAKI SRC-YƏ YAZ -->
        <img src="MEYVƏ_OYUNU_ŞƏKLİ.jpg" alt="Fruits Game" class="game-banner" onerror="this.src='https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=500'">
        <div class="game-title">🎰 FRUITS GAME (3x3)</div>

        <div class="bet-container">
            <div class="bet-label">MƏRC MƏBLƏĞİNİ SEÇİN:</div>
            <div class="bet-buttons">
                <button class="bet-btn active" onclick="selectBet(0.20, this)">0.20 ₼</button>
                <button class="bet-btn" onclick="selectBet(0.50, this)">0.50 ₼</button>
                <button class="bet-btn" onclick="selectBet(1.00, this)">1.00 ₼</button>
                <button class="bet-btn" onclick="selectBet(2.00, this)">2.00 ₼</button>
                <button class="bet-btn" onclick="selectBet(5.00, this)">5.00 ₼</button>
            </div>
        </div>

        <div class="fruit-grid" id="fruitGrid">
            <div class="fruit-cell">❓</div><div class="fruit-cell">❓</div><div class="fruit-cell">❓</div>
            <div class="fruit-cell">❓</div><div class="fruit-cell">❓</div><div class="fruit-cell">❓</div>
            <div class="fruit-cell">❓</div><div class="fruit-cell">❓</div><div class="fruit-cell">❓</div>
        </div>

        <button class="main-btn" onclick="spinFruits()">FIRLAT 🎰</button>
    </div>

    <!-- 2. MINES OYUNU -->
    <div class="game-card">
        <!-- 🔴 ƏVƏZ ET: MINES ŞƏKLİNİN LİNKİNİ AŞAĞIDAKI SRC-YƏ YAZ -->
        <img src="MINES_OYUNU_ŞƏKLİ.jpg" alt="Mines Game" class="game-banner" onerror="this.src='https://images.unsplash.com/photo-1605870445919-838d190e8e1b?w=500'">
        <div class="game-title">💣 MINES GAME (5x5)</div>

        <div class="bet-container">
            <div class="bet-label">MƏRC MƏBLƏĞİNİ SEÇİN:</div>
            <div class="bet-buttons">
                <button class="bet-btn active" onclick="selectBet(0.20, this)">0.20 ₼</button>
                <button class="bet-btn" onclick="selectBet(0.50, this)">0.50 ₼</button>
                <button class="bet-btn" onclick="selectBet(1.00, this)">1.00 ₼</button>
                <button class="bet-btn" onclick="selectBet(2.00, this)">2.00 ₼</button>
                <button class="bet-btn" onclick="selectBet(5.00, this)">5.00 ₼</button>
            </div>
        </div>

        <div class="mines-grid" id="minesGrid"></div>

        <button class="main-btn" onclick="initMines()">YENİ OYUN BAŞLAT 💣</button>
    </div>

    <script>
        let currentBet = 0.20;
        let balance = parseFloat(localStorage.getItem('userBalance')) || 10.00;
        document.getElementById('userBalance').innerText = balance.toFixed(2);

        // Web Audio Synthesizer (Səs Effekti Üçün)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type='sine', duration=0.1) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Mərc Seçimi
        function selectBet(amount, btn) {
            currentBet = amount;
            playSound(500, 'sine', 0.08);
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Meyvə Oyunu Məntiqi
        function spinFruits() {
            if (balance < currentBet) return alert("Yetersiz Balans!");
            balance -= currentBet;
            updateBalance();
            playSound(300, 'square', 0.2);

            const icons = ['🍎', '🍋', '🍇', '🔔', '💎', '7️⃣'];
            const cells = document.querySelectorAll('.fruit-cell');

            cells.forEach(cell => {
                cell.classList.add('spin');
                setTimeout(() => {
                    cell.innerText = icons[Math.floor(Math.random() * icons.length)];
                    cell.classList.remove('spin');
                }, 150);
            });
        }

        // Mines Oyunu Məntiqi
        function initMines() {
            if (balance < currentBet) return alert("Yetersiz Balans!");
            balance -= currentBet;
            updateBalance();
            playSound(600, 'sine', 0.15);

            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerText = '❓';
                cell.onclick = function() {
                    if (this.innerText !== '❓') return;
                    let isGem = Math.random() > 0.25;
                    if (isGem) {
                        this.innerText = '💎';
                        this.classList.add('open-gem');
                        playSound(800, 'sine', 0.1);
                    } else {
                        this.innerText = '💣';
                        this.classList.add('open-bomb');
                        playSound(150, 'sawtooth', 0.3);
                    }
                };
                grid.appendChild(cell);
            }
        }

        function updateBalance() {
            document.getElementById('userBalance').innerText = balance.toFixed(2);
            localStorage.setItem('userBalance', balance.toFixed(2));
        }

        initMines();
    </script>
</body>
</html>

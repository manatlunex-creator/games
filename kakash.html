<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kral Games - Admin Control</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #121721; padding: 20px; border-radius: 12px; border: 1px solid #1e2638; margin-bottom: 20px; }
        h2 { color: #f59e0b; font-size: 18px; margin-bottom: 12px; }
        input { background: #1c2538; border: 1px solid #28344d; color: #fff; padding: 10px; border-radius: 6px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #10b981; border: none; color: #fff; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #1e2638; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #161d2a; color: #f59e0b; }
        .btn-del { background: #ef4444; width: auto; padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎰 Meyvə Oyunu Jackpot Düşmə Şansı (%)</h2>
        <input type="number" id="jackpotChanceInput" placeholder="Nümaynamespace: 5 (yəni 5% şans)">
        <button onclick="saveJackpotChance()">ŞANSI YENİLƏ</button>
    </div>

    <div class="card">
        <h2>👤 Yeni İstifadəçi (PIN) Yarat / Balans Artır</h2>
        <input type="text" id="newPin" placeholder="6 rəqəmli PIN (məs: 123456)" maxlength="6">
        <input type="number" id="newBal" placeholder="Başlanğıc Balansı (AZN)">
        <button onclick="addUser()">YADA SAXLA</button>
    </div>

    <div class="card">
        <h2>📋 Mövcud İstifadəçilər</h2>
        <table>
            <thead>
                <tr>
                    <th>PIN Kod</th>
                    <th>Balans</th>
                    <th>Əməliyyat</th>
                </tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>

    <script>
        function loadAdminData() {
            const db = JSON.parse(localStorage.getItem('kral_users_db')) || {};
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = '';

            for (let pin in db) {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${pin}</b></td>
                        <td>${db[pin].balance} ₼</td>
                        <td><button class="btn-del" onclick="deleteUser('${pin}')">Sil</button></td>
                    </tr>
                `;
            }

            const chance = localStorage.getItem('kral_jackpot_chance') || 5;
            document.getElementById('jackpotChanceInput').value = chance;
        }

        function addUser() {
            const pin = document.getElementById('newPin').value.trim();
            const bal = parseFloat(document.getElementById('newBal').value) || 0;

            if (pin.length !== 6) return alert('PIN 6 rəqəm olmalıdır!');

            let db = JSON.parse(localStorage.getItem('kral_users_db')) || {};
            db[pin] = { balance: bal.toFixed(2) };
            localStorage.setItem('kral_users_db', JSON.stringify(db));

            alert(`PIN: ${pin} təyin olundu. Balans: ${bal} ₼`);
            document.getElementById('newPin').value = '';
            document.getElementById('newBal').value = '';
            loadAdminData();
        }

        function deleteUser(pin) {
            let db = JSON.parse(localStorage.getItem('kral_users_db')) || {};
            delete db[pin];
            localStorage.setItem('kral_users_db', JSON.stringify(db));
            loadAdminData();
        }

        function saveJackpotChance() {
            const chance = document.getElementById('jackpotChanceInput').value;
            localStorage.setItem('kral_jackpot_chance', chance);
            alert(`Jackpot düşmə şansı ${chance}% olaraq yeniləndi!`);
        }

        loadAdminData();
    </script>
</body>
</html>

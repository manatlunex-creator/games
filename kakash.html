<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kral Games - Admin Panel</title>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0c0b10; color: #fff; padding: 15px; display: flex; justify-content: center; }
    .admin-card { width: 100%; max-width: 480px; background: #15131d; border: 2px solid #ff3b30; border-radius: 15px; padding: 20px; box-shadow: 0 0 20px rgba(255, 59, 48, 0.3); }
    h2, h3 { color: #ffd700; text-align: center; margin-bottom: 15px; font-size: 18px; }
    
    /* Login */
    #login-box { display: block; text-align: center; }
    input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #443c59; background: #09080d; color: #fff; font-size: 15px; text-align: center; outline: none; }
    .btn { width: 90%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, #ff3b30, #c81912); color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    
    /* Panel */
    #panel-box { display: none; }
    .section { background: #09080d; border: 1px solid #2a243d; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
    .section h4 { color: #2ecc71; margin-bottom: 10px; border-bottom: 1px solid #1f1b2e; padding-bottom: 5px; font-size: 14px; }
    .btn-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
    .btn-red { background: linear-gradient(135deg, #ff3b30, #c81912); }
    .btn-sm { width: 48%; display: inline-block; padding: 10px; font-size: 13px; margin-top: 5px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; background: #1f1b2e; padding: 10px; border-radius: 6px; margin-top: 6px; font-size: 13px; border: 1px solid #332d4a; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>👑 KRAL GAMES ADMIN 👑</h2>

    <!-- GİRİŞ FORMU -->
    <div id="login-box">
      <input type="text" id="adminUser" placeholder="İstifadəçi Adı">
      <input type="password" id="adminPass" placeholder="Şifrə">
      <button class="btn" onclick="loginAdmin()">PANELƏ GİRİŞ</button>
      <div id="login-err" style="color:#ff3b30; margin-top:10px; font-weight:bold; font-size:13px;"></div>
    </div>

    <!-- İDARƏ PANELİ -->
    <div id="panel-box">
      
      <!-- 1. PIN & Canlı Balans İdarəsi -->
      <div class="section">
        <h4>🔑 PIN Kodlar və Canlı Balans</h4>
        <input type="text" id="newPin" placeholder="Yeni PIN (məs: 2110)">
        <button class="btn btn-green" onclick="addPin()">PIN KODU ƏLAVƏ ET</button>
        <div id="pinList" style="margin-top: 10px; max-height: 200px; overflow-y: auto;"></div>
      </div>

      <!-- 2. Balans Artırmaq / Silmək -->
      <div class="section">
        <h4>💰 Balans Əlavə Et / Çıxar</h4>
        <input type="text" id="targetPin" placeholder="PIN Kodu daxil et">
        <input type="number" id="balanceAmt" placeholder="Məbləğ (AZN)">
        <div style="display: flex; justify-content: space-between;">
          <button class="btn btn-green btn-sm" onclick="updateUserBal(true)">BALANS ARTIR</button>
          <button class="btn btn-red btn-sm" onclick="updateUserBal(false)">BALANS SİL</button>
        </div>
      </div>

      <!-- 3. Oyunda Şans və Jackpot Ayarları -->
      <div class="section">
        <h4>🎰 Oyun Ayarları və Jackpot</h4>
        <label style="font-size: 11px; color: #aaa; display:block; text-align:left;">Cari Jackpot (AZN):</label>
        <input type="number" id="jackpotInput" placeholder="Nüm: 250">
        <button class="btn" onclick="saveGameSettings()">YADDA SAXLA</button>
      </div>

      <button class="btn btn-red" onclick="location.reload()" style="width: 100%;">ÇIXIŞ ET</button>
    </div>
  </div>

  <script>
    // Firebase Konfiqurasiya
    const firebaseConfig = {
      apiKey: "AIzaSyCk2Szhnp_5q--hnKesbVs9Dp5eMj8ePLI",
      authDomain: "game-44f1a.firebaseapp.com",
      databaseURL: "https://game-44f1a-default-rtdb.firebaseio.com",
      projectId: "game-44f1a",
      storageBucket: "game-44f1a.firebasestorage.app",
      messagingSenderId: "121003848252",
      appId: "1:121003848252:web:b9b2cea6c9d9682e89c939"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Panel Girişi
    function loginAdmin() {
      const u = document.getElementById("adminUser").value.trim();
      const p = document.getElementById("adminPass").value.trim();

      if(u === "Escobar211_98" && p === "AA211_48") {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("panel-box").style.display = "block";
        loadPins();
        loadSettings();
      } else {
        document.getElementById("login-err").innerText = "İstifadəçi adı və ya şifrə səhvdir!";
      }
    }

    // 2. PIN Yaratmaq
    function addPin() {
      const pin = document.getElementById("newPin").value.trim();
      if(!pin) return alert("PIN yazın!");

      db.ref("pins/" + pin).set({
        active: true,
        balance: 0.00
      }).then(() => {
        document.getElementById("newPin").value = "";
      });
    }

    // PIN Siyahısı və Canlı Balans Dinləyicisi (on value)
    function loadPins() {
      db.ref("pins").on("value", (snapshot) => {
        const list = document.getElementById("pinList");
        list.innerHTML = "";
        snapshot.forEach((child) => {
          const p = child.key;
          const val = child.val();
          const bal = val.balance !== undefined ? parseFloat(val.balance).toFixed(2) : "0.00";
          list.innerHTML += `
            <div class="list-item">
              <span>📌 <b>${p}</b> | Balans: <b style="color:#2ecc71;">${bal} AZN</b></span>
              <button style="background:#ff3b30; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="deletePin('${p}')">SİL</button>
            </div>
          `;
        });
      });
    }

    function deletePin(pin) {
      if(confirm(pin + " PIN kodunu silmək istədiyinizdən əminsiniz?")) {
        db.ref("pins/" + pin).remove();
      }
    }

    // 3. Balans Artırmaq / Silmək
    function updateUserBal(isAdd) {
      const pin = document.getElementById("targetPin").value.trim();
      const amt = parseFloat(document.getElementById("balanceAmt").value);

      if(!pin || isNaN(amt)) return alert("PIN və məbləği tam yazın!");

      db.ref("pins/" + pin).once("value").then((snapshot) => {
        if(!snapshot.exists()) return alert("Bu PIN tapılmadı!");
        
        let currentBal = snapshot.val().balance || 0;
        let newBal = isAdd ? (currentBal + amt) : (currentBal - amt);
        if(newBal < 0) newBal = 0;

        db.ref("pins/" + pin + "/balance").set(newBal).then(() => {
          document.getElementById("targetPin").value = "";
          document.getElementById("balanceAmt").value = "";
        });
      });
    }

    // 4. Jackpot Ayarları
    function saveGameSettings() {
      const jackpot = document.getElementById("jackpotInput").value;
      db.ref("settings").update({
        jackpot: jackpot ? parseFloat(jackpot) : 250
      }).then(() => alert("Jackpot yadda saxlanıldı!"));
    }

    function loadSettings() {
      db.ref("settings").once("value").then((snapshot) => {
        if(snapshot.exists()) {
          const data = snapshot.val();
          if(data.jackpot) document.getElementById("jackpotInput").value = data.jackpot;
        }
      });
    }
  </script>
</body>
</html>
